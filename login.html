<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OdontoPlus - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div style="max-width: 380px; margin: 80px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center;">
    <h1 class="logo" style="margin-bottom: 20px;">Odonto<span>Plus</span></h1>
    <p style="margin-bottom: 20px; color: #666;">Acesso ao Painel do Dentista</p>
    
    <form id="login-form" style="display: flex; flex-direction: column; gap: 15px;">
      <input type="text" id="username" placeholder="Usuário (admin)" required style="padding: 12px; border: 1px solid #ccc; border-radius: 5px;">
      <input type="password" id="password" placeholder="Senha (1234)" required style="padding: 12px; border: 1px solid #ccc; border-radius: 5px;">
      <button type="submit" class="btn">Entrar</button>
    </form>     
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(event) {
      event.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      if (user === 'admin' && pass === '1234') {
        window.location.href = 'dashboard.html';
      } else {
        alert('Usuário ou senha incorretos!');
      }
    });
  </script>
</body>
</html>
