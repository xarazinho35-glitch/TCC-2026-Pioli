<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OdontoPlus - Login Administrativo</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Estilo Principal -->
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
    }

    .login-card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
      border: 1px solid #e2e8f0;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h1 {
      font-size: 1.8rem;
      color: var(--primary-color, #0284c7);
      margin-bottom: 5px;
    }

    .login-header p {
      color: #64748b;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #334155;
      font-size: 0.9rem;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 12px 12px 42px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    .input-wrapper input:focus {
      outline: none;
      border-color: var(--primary-color, #0284c7);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: var(--primary-color, #0284c7);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-login:hover {
      opacity: 0.9;
    }

    .error-message {
      color: #ef4444;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 15px;
      display: none;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .back-link:hover {
      color: var(--primary-color, #0284c7);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <h1><i class="fa-solid fa-tooth"></i> Odonto<span>Plus</span></h1>
      <p>Acesso Restrito ao Painel</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Usuário</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="username" placeholder="Digite seu usuário" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="Digite sua senha" required>
        </div>
      </div>

      <button type="submit" class="btn-login"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button>

      <p id="error-msg" class="error-message"><i class="fa-solid fa-circle-exclamation"></i> Usuário ou senha incorretos!</p>
    </form>

    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Voltar para o site</a>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();

      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');

      // Credenciais padrão para a demonstração do TCC
      if (user === 'admin' && pass === '1234') {
        errorMsg.style.display = 'none';
        window.location.href = 'dashboard.html';
      } else {
        errorMsg.style.display = 'block';
      }
    }
  </script>

</body>
</html>
