<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OdontoPlus - Painel Administrativo</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    /* Estilos do Dark Mode */
    body.dark-theme {
      background-color: #121212;
      color: #e0e0e0;
    }
    body.dark-theme header,
    body.dark-theme .stat-card,
    body.dark-theme .dashboard-table {
      background-color: #1e1e1e;
      color: #e0e0e0;
      border-color: #333;
    }
    body.dark-theme .dashboard-table td {
      border-bottom-color: #333;
    }
    body.dark-theme input, body.dark-theme select {
      background-color: #2b2b2b;
      color: #fff;
      border-color: #444;
    }

    /* Botões das Ações */
    .btn-confirm { background-color: #28a745; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; margin-right: 4px; font-size: 0.8rem; }
    .btn-delete { background-color: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .btn-whatsapp { background-color: #25d366; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; margin-right: 4px; font-size: 0.8rem; text-decoration: none; display: inline-block; }
    .btn-print { background-color: #17a2b8; color: white; border: none; padding: 10px 18px; border-radius: var(--border-radius, 8px); cursor: pointer; font-weight: 600; }
    .btn-theme { background-color: #6c757d; color: white; border: none; padding: 10px 15px; border-radius: var(--border-radius, 8px); cursor: pointer; font-weight: 600; margin-right: 10px; }

    .filter-container { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-container input, .filter-container select { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; }
    .search-input { flex: 1; min-width: 220px; }

    @media print {
      header, .btn-confirm, .btn-delete, .btn-whatsapp, .btn-print, .btn-theme, .nav-links, .filter-container, .no-print { display: none !important; }
      body { background: white; color: black; }
      main { padding: 0 !important; max-width: 100% !important; }
      .dashboard-table { box-shadow: none; border: 1px solid #ccc; }
    }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <h1 class="logo"><i class="fa-solid fa-tooth"></i> Odonto<span>Plus</span> <small style="font-size: 0.5em; color: var(--text-muted); font-weight: 400;">| Painel</small></h1>
      <ul class="nav-links">
        <li><a href="login.html" style="color: #dc3545; font-weight: 600;"><i class="fa-solid fa-right-from-bracket"></i> Sair</a></li>
      </ul>
    </nav>
  </header>

  <main style="padding: 40px 8%; max-width: 1200px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px;">
      <div>
        <h2 style="color: var(--primary-color);"><i class="fa-solid fa-chart-line"></i> Painel Geral</h2>
        <p style="color: var(--text-muted);">Resumo de desempenho e consultas da clínica.</p>
      </div>
      <div>
        <button class="btn-theme" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i> Tema</button>
        <button class="btn-print" onclick="window.print()"><i class="fa-solid fa-print"></i> PDF</button>
      </div>
    </div>

    <div class="stats-container">
      <div class="stat-card">
        <h3><i class="fa-solid fa-users"></i> Total</h3>
        <p id="stat-total">0</p>
      </div>
      <div class="stat-card pending">
        <h3><i class="fa-solid fa-clock"></i> Pendentes</h3>
        <p id="stat-pending">0</p>
      </div>
      <div class="stat-card confirmed">
        <h3><i class="fa-solid fa-circle-check"></i> Confirmados</h3>
        <p id="stat-confirmed">0</p>
      </div>
    </div>

    <h2 style="margin-top: 30px; color: var(--primary-color); font-size: 1.4rem;"><i class="fa-solid fa-list-check"></i> Consultas Solicitadas</h2>

    <div class="filter-container" style="margin-top: 15px;">
      <input type="text" id="search-input" class="search-input" placeholder="Buscar por paciente, serviço ou data..." oninput="renderAppointments()">
      <select id="status-filter" onchange="renderAppointments()">
        <option value="all">Todos os Status</option>
        <option value="Pendente">Pendentes</option>
        <option value="Confirmado">Confirmados</option>
      </select>
    </div>

    <table class="dashboard-table">
      <thead>
        <tr>
          <th>Paciente</th>
          <th>Telefone</th>
          <th>Serviço</th>
          <th>Data</th>
          <th>Status</th>
          <th class="no-print">Ações</th>
        </tr>
      </thead>
      <tbody id="appointments-list">
      </tbody>
    </table>
  </main>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark-theme');
    }

    // Função auxiliar para inicializar dados fictícios caso o localStorage esteja vazio
    function initDemoData() {
      const stored = localStorage.getItem('appointments');
      if (!stored || JSON.parse(stored).length === 0) {
        const demoData = [
          { name: "Mariana Silva", phone: "(34) 99876-5432", service: "Limpeza e Clareamento", date: "2026-10-15", status: "Confirmado" },
          { name: "Carlos Eduardo", phone: "(34) 99123-4567", service: "Ortodontia", date: "2026-10-16", status: "Pendente" },
          { name: "Fernanda Costa", phone: "(34) 98888-7777", service: "Implante Dentário", date: "2026-10-20", status: "Pendente" }
        ];
        localStorage.setItem('appointments', JSON.stringify(demoData));
      }
    }

    // Converte a data de AAAA-MM-DD para DD/MM/AAAA para exibição amigável
    function formatDate(dateStr) {
      if (!dateStr) return 'N/I';
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      return dateStr;
    }

    function renderAppointments() {
      const list = document.getElementById('appointments-list');
      const appointments = JSON.parse(localStorage.getItem('appointments')) || [];

      document.getElementById('stat-total').innerText = appointments.length;
      document.getElementById('stat-pending').innerText = appointments.filter(a => a.status === 'Pendente').length;
      document.getElementById('stat-confirmed').innerText = appointments.filter(a => a.status === 'Confirmado').length;

      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      const statusFilter = document.getElementById('status-filter').value;

      const filteredAppointments = appointments.filter(app => {
        const matchesSearch = app.name.toLowerCase().includes(searchTerm) || 
                              app.service.toLowerCase().includes(searchTerm) ||
                              (app.date && app.date.includes(searchTerm));
        const matchesStatus = statusFilter === 'all' || app.status === statusFilter;
        return matchesSearch && matchesStatus;
      });

      list.innerHTML = '';

      if (filteredAppointments.length === 0) {
        list.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-muted); padding: 30px;">Nenhum agendamento encontrado.</td></tr>';
        return;
      }

      filteredAppointments.forEach((app) => {
        const originalIndex = appointments.indexOf(app);
        const row = document.createElement('tr');
        const badgeClass = app.status === 'Confirmado' ? 'confirmed' : 'pending';
        
        // Limpa formatação numérica do telefone para a API do WhatsApp
        const cleanPhone = app.phone.replace(/\D/g, '');
        const displayDate = formatDate(app.date);
        const whatsappMsg = encodeURIComponent(`Olá ${app.name}! Confirmamos a sua consulta de ${app.service} para o dia ${displayDate}. Equipe OdontoPlus.`);

        row.innerHTML = `
          <td><strong>${app.name}</strong></td>
          <td>${app.phone}</td>
          <td>${app.service}</td>
          <td>${displayDate}</td>
          <td><span class="badge ${badgeClass}">${app.status}</span></td>
          <td class="no-print">
            <a href="https://api.whatsapp.com/send?phone=55${cleanPhone}&text=${whatsappMsg}" target="_blank" class="btn-whatsapp" title="Notificar via WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
            ${app.status === 'Pendente' 
              ? `<button class="btn-confirm" onclick="confirmAppointment(${originalIndex})" title="Confirmar Agendamento"><i class="fa-solid fa-check"></i></button>` 
              : ''}
            <button class="btn-delete" onclick="deleteAppointment(${originalIndex})" title="Excluir Agendamento"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
        list.appendChild(row);
      });
    }

    function confirmAppointment(index) {
      const appointments = JSON.parse(localStorage.getItem('appointments')) || [];
      appointments[index].status = 'Confirmado';
      localStorage.setItem('appointments', JSON.stringify(appointments));
      renderAppointments();
    }

    function deleteAppointment(index) {
      if (confirm("Tem certeza de que deseja excluir este agendamento?")) {
        const appointments = JSON.parse(localStorage.getItem('appointments')) || [];
        appointments.splice(index, 1);
        localStorage.setItem('appointments', JSON.stringify(appointments));
        renderAppointments();
      }
    }

    // Inicialização
    initDemoData();
    renderAppointments();
  </script>

  <!-- Rodapé do Painel -->
  <footer style="text-align: center; padding: 25px; color: var(--text-muted); font-size: 0.9rem; margin-top: 40px; border-top: 1px solid #edf2f7;">
    <p>&copy; 2026 OdontoPlus - Painel de Controle Administrativo. Projeto Acadêmico TCC.</p>
  </footer>   
</body>
</html>
